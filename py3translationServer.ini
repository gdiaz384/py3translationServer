# py3translationServer configuration file
# # means comment.
# ( ) is the default value.
# Leave a value blank after the = to leave as default.
# Options specified during runtime at the CLI overwrite these values.

[py3translationServer]
# A comma separated list of known engine.modelGroup combinations. Each modelGroup should have a [configuration section] below, appropriate resources/engines/[engineName]/[modelGroup].py files, a default modelName, and a modelPath. Replace any path separators, like \ or /, with dots as in 'engine.modelGroup', and exclude the .py extension.
modelDatabase = fairseq.sugoi, ctranslate2.sugoi, transformers.opusmt.opus-mt-tc-bible-big
# The modelGroup that should handle requests by default.
defaultModelGroup = ctranslate2.sugoi

# The hardware to use for inference. (None) means autodetect which will use cuda if it is available and fallback to cpu otherwise. fairseq can also use directml, but that requires a very special local environment. This device= setting under [py3translationServer] is the global default that will cascade to every modelGroup. To override the device for a specific model, add 'device=cpu' or 'device=cuda' to that [modelGroup's configuration] section below.
# (None), cpu, cuda, directml
device =
# Host address. 0.0.0.0 means 'bind to all local addresses'. localhost has an alias of 127.0.0.1
# (localhost), (127.0.0.1), 0.0.0.0, 192.168.0.1
address =
# (14366)
port = 14366
# If the model is loaded but not being used, it will automatically unload after this many seconds of inactivity. Default is to unload the model after 300 seconds, 5 minutes. 0 means always unload it after every request. To keep a model always loaded, set preloadModel=True, and fill in at least the engine, modelGroup, modelName, and modelPath below.
unloadTime = 300

# Load a model into memory immediately after launch, and keep it always loaded. True, (False)
preloadModel = False
# If preloadModel is True, this is the backend engine to load. Must be fairseq, ctranslate2, or transformers.
engine =
# If preloadModel is True, this is the modelGroup.py to load. Replace any path separators, like \ or /, with dots as in 'folder.to.modelGroup' and exclude the .py extension and path to the resources/engines/ folder. Example: fairseq.sugoi, ctranslate2.sugoi, transformers.opusmt.opus-mt-big
modelGroup =
# If preloadModel is True, this is the name of the model to preload. This must be defined in modelGroup.models. Example: sugoi-v4
modelName =
# If preloadModel is True, the C:/path/to/model.bin for the chosen modelName.
modelPath =
# Only if preloadModel is True, the initial source language. Different models use different language code formatting.
sourceLanguage =
# Only if preloadModel is True, the initial target language. Different models use different language code formatting.
targetLanguage =

# Enable caching of translations. (True), False
cacheEnabled = True
# cachePath found below is normally used to store cache. Setting storeCacheInLocalEnvironment to True changes the storage location of the cache to:
# Windows: ~\AppData\Local\py3translationServer\cache
# Linux: ~/.cache/py3translationServer/cache
# True, (False)
storeCacheInLocalEnvironment = False
# Path to the folder that will be used to store cache. Can be relative to program.py/.exe or absolute. Only used if storeCacheInLocalEnvironment is False.
# default = (.\resources\cache)
cachePath = .\resources\cache
# The minimum number of seconds that must pass before cache can be written to disk. (60)
saveCacheInterval =
# The minimum number of seconds that must pass before cache can be cleared. (60)
clearCacheInterval =

# The path to the streamlit UI.py. Using streamlit requires installing it via: pip install streamlit
uiPath =
# Disable keeping track of the amount of time it took to load the program and fulfill requests. True, (False)
disablePerfMetrics = False

# (utf-8)
consoleEncoding =
# https://docs.python.org/3.8/library/codecs.html#error-handlers
# strict, ignore, replace, xmlcharrefreplace, backslashreplace, surrogateescape
inputFileErrorHandling = strict
# strict, ignore, replace, xmlcharrefreplace, backslashreplace, namereplace
outputFileErrorHandling =
# Print out more information. True, ( False )
verbose =
# Print out information to help with debugging. True, ( False )
debug =
# Print out version information and exit. True, ( False )
version = False

[fairseq.sugoi]
# Required. The name of the model to load by default for this group. (sugoi-v4), sugoi-levi
modelName = sugoi-v4
# Required. The default model's C:\fully\qualified\path\to\model.pretrained
modelPath = C:\Users\Public\Downloads\models\sugoiv4\big.pretrain.pt
sourceLanguage = ja
targetLanguage = en
# The folder name that contains the source and targetLanguageSentencePieceModels. Can be a comma separated list.
sentencePieceModelFolder = spm, ../spmModel
# The path to the sentencepiece model. Can be relative to modelPath or absolute.
sourceLanguageSpm = spm/spm.ja.nopretok.model
targetLanguageSpm = spm.en.nopretok.model
beam_size = 5
# Integer, ( 0 )
max_len_a = 0
# Integer, ( 200 )
max_len_b = 200
# Integer, ( 1 )
min_len = 1
# (True), False
normalize_scores = True
# Integer, ( 1 )
len_penalty = 1
# Integer, ( 0 )
unk_penalty = 0
# Float, ( 1.0 )
temperature = 1.0
# True, ( False )
match_source_len = False
# Prevent repetitions of ngrams with this size (set 0 to disable). Integer, ( 0 )
no_repeat_ngram_size = 3

[fairseq.sugoi#sugoi-v4]
# (None), cpu, cuda, gpu, directml # gpu is aliased to cuda.
device = cuda
modelPath = C:\Users\Public\Downloads\models\sugoiv4\big.pretrain.pt
sourceLanguage = ja

[ctranslate2.sugoi]
# https://opennmt.net/CTranslate2/python/ctranslate2.Translator.html
# Required. The name of the model to load by default for this group. (sugoi-v4), sugoi-levi
modelName = sugoi-v4
# Required. The default model's C:\fully\qualified\path\to\model.bin.
modelPath = C:\Users\Public\Downloads\models\sugoiv4\model.bin
sourceLanguage = ja
targetLanguage = en
# The folder name that contains the source and targetLanguageSentencePieceModels. Can be a comma separated list. Must be relative to modelPath.
sentencePieceModelFolder = spm, ../spmModel
# The path to the sentencepiece model. Can be relative to modelPath or absolute.
sourceLanguageSpm = spm.ja.nopretok.model
targetLanguageSpm = spm/spm.en.nopretok.model
# Cpu threads: (0)=Auto, 2, 4, 6, 8
intra_threads = 0
# Maximum number of parallel translations. Default=1. Higher values increase video memory usage when using CUDA. Seems to have no or little effect on CPU loads and processing time.
# https://opennmt.net/CTranslate2/parallel.html#data-parallelism
inter_threads = 8
# beam_size is the number of tokens generated by the model. The best one will be chosen as the return value. Directly affects quality. This is the main speed vs quality setting.
# Default=2. Changed to 5 as per default setting in fairseq source code. 
# https://opennmt.net/CTranslate2/guides/fairseq.html#beam-search-equivalence
# Set beam size (1 for greedy search). Best performance is 1.
beam_size = 5
# The decoding will continue until beam_size*patience hypotheses are finished.
patience = 1.0
# Number of results to return. Integer ( 1 )
num_hypotheses = 1
# Exponential penalty applied to the length during beam search. Float ( 1.0 )
length_penalty = 1.0
# Coverage penalty weight applied during beam search. Float ( 0.0 )
coverage_penalty = 0.0
# Penalty applied to the score of previously generated tokens (set > 1 to penalize). Float ( 0.0 )
repetition_penalty = 1.0
# Prevent repetitions of ngrams with this size (set 0 to disable). Integer, ( 0 )
no_repeat_ngram_size = 3
# Disable the generation of the unknown token. True, ( False )
disable_unk = True
# Disable the generation of some sequences of tokens. A list of strings.
suppress_sequences = None
# Stop the decoding on one of these tokens (defaults to the model EOS token). A list of strings or integers.
end_token = None
# Include the end token in the results. True, ( False )
return_end_token = False
# Bias translations towards given prefix. Float ( 0.0 )
prefix_bias_beta = 0.0
# Truncate inputs after this many tokens (set 0 to disable). Int ( 1024 )
max_input_length = 1024
# Maximum prediction length. Integer ( 256 )
max_decoding_length = 256
# Minimum prediction length. Integer ( 1 )
min_decoding_length = 1
# Setting this to True corrupts the output, so leave as False until correct vmap can be built. True, ( False )
use_vmap = False
# Include the scores in the output. True, ( False )
return_scores = False
# Include the log probs of each token in the output. True, (False), only valid for ctranslate2 >= 4.4.0
return_logits_vocab = False
# Include the attention vectors in the output. True, ( False )
return_attention = False
# Return alternatives at the first unconstrained decoding position. True, ( False )
return_alternatives = False
# Minimum initial probability to expand an alternative. Float ( 0.0 )
min_alternative_expansion_prob = 0.0
# Randomly sample predictions from the top K candidates. Integer ( 1 )
sampling_topk = 1
# Keep the most probable tokens whose cumulative probability exceeds this value. Float ( 1.0 )
sampling_topp = 1.0
# Sampling temperature to generate more random samples. Float ( 1.0 )
sampling_temperature = 1.0
# Replace unknown target tokens by the source token with the highest attention. True, ( False )
replace_unknowns = False

[ctranslate2.sugoi#sugoi-levi]
modelPath = C:\Users\Public\Downloads\models\sugoi-levi\model.bin

[transformers.opusmt.opus-mt-tc-bible-big]
# Required. The name of the model to load by default for this group. ( sugoi-v4 ), sugoi-levi
modelName = sugoi-v4
# Required. The default model's C:\fully\qualified\path\to\model.bin. Transformers models can also use 'publisher/model-name' syntax if and only if the model is already available in the default huggingface/hub cache.
modelPath = C:\Users\Public\Downloads\models\marianmt\model.bin
sourceLanguage = ja
targetLanguage = en
